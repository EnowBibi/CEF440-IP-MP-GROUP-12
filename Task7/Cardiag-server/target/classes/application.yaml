            client-id: 813841474406-mqcd2599t1vm5q0g26g7l0afjm2a7ulf.apps.googleusercontent.com
            client-secret: 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
            scope:
              - profile
              - email
  data:
